<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de Sesión</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #6a11cb, #2575fc);
        }

        .login {
            width: 90%;
            max-width: 400px;

            background: white;
            padding: 40px;

            border-radius: 25px;
            text-align: center;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);

            animation: aparecer 0.8s ease;
        }

        .icono {
            font-size: 65px;
            margin-bottom: 10px;
        }

        h1 {
            color: #2575fc;
            margin-bottom: 10px;
        }

        .texto {
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 2px solid #ddd;
            border-radius: 12px;

            font-size: 16px;
            outline: none;

            transition: 0.3s;
        }

        input:focus {
            border-color: #2575fc;
            box-shadow: 0 0 8px rgba(37, 117, 252, 0.3);
        }

        button {
            width: 100%;
            margin-top: 25px;

            padding: 14px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(37, 117, 252, 0.4);
        }

        #mensaje {
            margin-top: 18px;
            font-weight: bold;
        }

        .error {
            color: #e53935;
        }

        .correcto {
            color: #16a34a;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="login">

        <div class="icono">🔐</div>

        <h1>Iniciar Sesión</h1>

        <p class="texto">
            Ingresa tus datos para continuar
        </p>

        <form onsubmit="iniciarSesion(event)">

            <label for="usuario">👤 Usuario</label>

            <input
                type="text"
                id="usuario"
                placeholder="Escribe tu usuario"
                required
            >

            <label for="clave">🔒 Contraseña</label>

            <input
                type="password"
                id="clave"
                placeholder="Escribe tu contraseña"
                required
            >

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

        <p id="mensaje"></p>

    </div>


<script>

    function iniciarSesion(event) {

        event.preventDefault();

        // USUARIOS
        const usuarios = {
            "tesla": {
                clave: "Luffy123",
                nombre: "tesla Georgette_666"
            },

            "Mapi_emi": {
                clave: "lasgerreraskpop123",
                nombre: "Mapi_emi"
            },

            "Vivian_003": {
                clave: "01746",
                nombre: "Vivian_003"
            },

            "anyelx.t": {
                clave: "elnegrito.ozuna0.2",
                nombre: "anyelx.t"
            },

            "susu": {
                clave: "kchar",
                nombre: "susu"
            },

            // USUARIO ORIGINAL
            "santadorotea": {
                clave: "changuito123",
                nombre: "santadorotea"
            }
        };

        // DATOS INGRESADOS
        const usuario = document.getElementById("usuario").value.trim();
        const clave = document.getElementById("clave").value;

        const mensaje = document.getElementById("mensaje");

        // COMPROBAR DATOS
        if (usuarios[usuario] && usuarios[usuario].clave === clave) {

            mensaje.textContent = "✅ Inicio de sesión correcto";
            mensaje.className = "correcto";

            // Guardar el usuario para mostrarlo en estudio.html
            localStorage.setItem(
                "nombreUsuario",
                usuarios[usuario].nombre
            );

            setTimeout(function() {
                window.location.href = "estudio.html";
            }, 800);

        } else {

            mensaje.textContent = "❌ Usuario o contraseña incorrectos";
            mensaje.className = "error";

        }
    }

</script>

</body>
</html>
